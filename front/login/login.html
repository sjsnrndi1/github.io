<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 연습장</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="member-page">
    <main class="member-shell">
      <section class="member-visual" aria-label="로그인 안내">
        <a class="member-logo" href="../../index.html" aria-label="연습장 홈">
          <span class="member-logo-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <rect x="7" y="6" width="27" height="34" rx="5" fill="#fffdf8" stroke="#4f6f52" stroke-width="2.5" />
              <path d="M14 15h13M14 22h10M14 29h12" stroke="#ddd7ca" stroke-width="2.5" stroke-linecap="round" />
              <path d="M32.5 13.5l6.9 6.9-14.5 14.5-8.1 1.9 1.9-8.1 13.8-15.2z" fill="#b7754c" />
              <path d="M31 34.2l2.1 2.1 4-4.5" fill="none" stroke="#fffdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>연습장</span>
        </a>

        <div class="member-visual-copy">
          <p class="eyebrow">Welcome Back</p>
          <h1>다시 꺼내 보는 나의 기록.</h1>
          <p>
            적어둔 생각과 공부의 흔적을 이어서 정리할 수 있도록,
            연습장으로 조용히 돌아옵니다.
          </p>
        </div>
      </section>

      <section class="member-panel" aria-label="로그인">
        <div class="member-card">
          <div class="member-card-head">
            <p class="eyebrow">Sign In</p>
            <h2>로그인</h2>
            <p>기록해둔 것들을 다시 꺼내볼 준비를 합니다.</p>
          </div>

          <form class="member-form" data-auth-form data-auth-type="login">
            <label for="login-email">
              이메일
              <input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
            </label>

            <label for="login-password">
              비밀번호
              <input
                id="login-password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력하세요"
                autocomplete="current-password"
                required
              />
            </label>

            <div class="form-options">
              <label class="check-label">
                <input type="checkbox" name="remember" />
                로그인 유지
              </label>
              <a href="#">비밀번호 찾기</a>
            </div>

            <button type="submit" class="member-submit">로그인</button>
          </form>

          <p class="member-message" data-auth-message role="alert" aria-live="polite"></p>

          <p class="member-switch">아직 계정이 없나요? <a href="signup.html">회원가입</a></p>
        </div>
      </section>
    </main>

    <script src="../../assets/js/user/auth.js"></script>
  </body>
</html>
