<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | MySite</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabaseUrl = "https://nrlkhbgeynmiqesglhgt.supabase.co/rest/v1/";
      const supabaseKey = "sb_publishable_xoEN2afiedAx0kZBd2022w_KFeCqecX";

      const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

      async function signUp() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signUp({
          name: name,
          email: email,
          password: password,
        });

        if (error) {
          console.error(error);
          alert(error.message);
          return;
        }

        console.log(data);
        alert("회원가입 성공");
      }
    </script>
  </head>
  <body class="member-page">
    <main class="member-shell">
      <section class="member-visual signup-visual" aria-label="회원가입 안내">
        <a
          class="logo member-logo"
          href="../../index.html"
          aria-label="MySite 홈"
        >
          <span class="logo-mark">M</span>
          <span>MySite</span>
        </a>

        <div class="member-visual-copy">
          <p class="eyebrow">Create Account</p>
          <h1>새로운 계정을 만들어 보세요.</h1>
          <p>
            회원가입 후 더 편하게 콘텐츠를 확인하고 업데이트 소식을 받아볼 수
            있습니다.
          </p>
        </div>
      </section>

      <section class="member-panel" aria-label="회원가입">
        <div class="member-card">
          <div class="member-card-head">
            <p class="eyebrow">Join Us</p>
            <h2>회원가입</h2>
            <p>사용할 계정 정보를 입력해 주세요.</p>
          </div>

          <form class="member-form" data-auth-form data-auth-type="signup">
            <label for="signup-name">
              이름
              <input
                id="signup-name"
                name="name"
                type="text"
                placeholder="홍길동"
                autocomplete="name"
                required
              />
            </label>

            <label for="signup-email">
              이메일
              <input
                id="signup-email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </label>

            <label for="signup-password">
              비밀번호
              <input
                id="signup-password"
                name="password"
                type="password"
                placeholder="8자 이상 입력"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>

            <label for="signup-password-confirm">
              비밀번호 확인
              <input
                id="signup-password-confirm"
                name="passwordConfirm"
                type="password"
                placeholder="비밀번호 재입력"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>

            <label class="check-label agree-label">
              <input type="checkbox" name="terms" required />
              서비스 이용약관과 개인정보 처리방침에 동의합니다.
            </label>

            <button type="submit" class="member-submit">회원가입</button>
          </form>

          <p
            class="member-message"
            data-auth-message
            role="alert"
            aria-live="polite"
          ></p>

          <p class="member-switch">
            이미 계정이 있나요? <a href="login.html">로그인</a>
          </p>
        </div>
      </section>
    </main>

    <script src="../../assets/js/user/auth.js"></script>
  </body>
</html>
