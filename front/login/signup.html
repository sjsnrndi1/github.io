<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | 연습장</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="member-page">
    <main class="member-shell">
      <section class="member-visual signup-visual" aria-label="회원가입 안내">
        <a class="member-logo" href="../../index.html" aria-label="연습장 홈">
          <span class="member-logo-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <rect x="7" y="6" width="27" height="34" rx="5" fill="#fffdf8" stroke="#4f6f52" stroke-width="2.5" />
              <path d="M14 15h13M14 22h10M14 29h12" stroke="#ddd7ca" stroke-width="2.5" stroke-linecap="round" />
              <path d="M32.5 13.5l6.9 6.9-14.5 14.5-8.1 1.9 1.9-8.1 13.8-15.2z" fill="#b7754c" />
              <path d="M31 34.2l2.1 2.1 4-4.5" fill="none" stroke="#fffdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>연습장</span>
        </a>

        <div class="member-visual-copy">
          <p class="eyebrow">Create Account</p>
          <h1>내 연습장을 새로 펼칩니다.</h1>
          <p>
            배운 것, 막혔던 것, 다시 보고 싶은 조각들을
            천천히 쌓아둘 작은 공간을 준비합니다.
          </p>
        </div>
      </section>

      <section class="member-panel" aria-label="회원가입">
        <div class="member-card">
          <div class="member-card-head">
            <p class="eyebrow">Join</p>
            <h2>회원가입</h2>
            <p>연습장에 남길 이름과 계정 정보를 입력해주세요.</p>
          </div>

          <form class="member-form" data-auth-form data-auth-type="signup">
            <label for="signup-name">
              이름
              <input id="signup-name" name="name" type="text" placeholder="홍길동" autocomplete="name" required />
            </label>

            <label for="signup-email">
              이메일
              <input id="signup-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
            </label>

            <label for="signup-password">
              비밀번호
              <input
                id="signup-password"
                name="password"
                type="password"
                placeholder="8자 이상 입력"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>

            <label for="signup-password-confirm">
              비밀번호 확인
              <input
                id="signup-password-confirm"
                name="passwordConfirm"
                type="password"
                placeholder="비밀번호를 한 번 더 입력"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>

            <label class="check-label agree-label">
              <input type="checkbox" name="terms" required />
              연습장 이용을 위한 기본 약관에 동의합니다.
            </label>

            <button type="submit" class="member-submit">회원가입</button>
          </form>

          <p class="member-message" data-auth-message role="alert" aria-live="polite"></p>

          <p class="member-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p>
        </div>
      </section>
    </main>

    <script src="../../assets/js/user/auth.js"></script>
  </body>
</html>
