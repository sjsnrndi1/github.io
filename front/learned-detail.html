<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배운 것들 상세 | 연습장</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../assets/css/app.css" />
    <script src="../assets/js/app.js"></script>
  </head>
  <body>
    <div id="header"></div>

    <main class="learned-main">
      <article class="learned-detail" data-learned-detail></article>

      <section class="comment-panel" aria-label="댓글">
        <div class="comment-panel-head">
          <div>
            <p class="eyebrow">Comments</p>
            <h2>댓글</h2>
          </div>
          <span data-comment-count></span>
        </div>

        <div class="comment-login-callout" data-comment-login-callout hidden>
          <p>로그인해야 댓글을 남길 수 있습니다.</p>
          <a class="member-submit comment-login-link" href="login/login.html">로그인 화면으로 이동</a>
        </div>

        <form class="comment-form" data-comment-form>
          <label>
            이름
            <input name="name" type="text" placeholder="이름을 입력해주세요" required />
          </label>
          <label>
            댓글
            <textarea name="content" rows="4" placeholder="가볍게 남겨주세요" required></textarea>
          </label>
          <button type="submit" class="member-submit">댓글 남기기</button>
          <p class="member-message" data-comment-message role="alert" aria-live="polite"></p>
        </form>

        <div class="comment-list" data-comment-list></div>
      </section>
    </main>

    <div id="footer"></div>
  </body>
</html>
