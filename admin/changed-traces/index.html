<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/github.io/favicon.svg" />
    <title>바뀐 흔적 관리</title>
    <link rel="stylesheet" href="/github.io/assets/css/admin/style.css" />
    <link rel="stylesheet" href="/github.io/assets/css/admin/board/style.css" />
  </head>
  <body class="admin-app-page">
    <div id="header-container"></div>

    <main class="admin-main board-main">
      <section class="board-page-head">
        <div>
          <p class="dashboard-eyebrow">변경 기록</p>
          <h2>바뀐 흔적 관리</h2>
          <p>사이트에서 달라진 내용을 날짜와 간단한 요약으로 남겨주세요.</p>
        </div>
        <a class="admin-btn" href="/github.io/front/about/changed-traces.html">사용자 화면 보기</a>
      </section>

      <section class="admin-card board-form-card">
        <form id="traceForm" class="admin-form">
          <h3 id="formTitle">새 기록 등록</h3>
          <label for="traceDate">
            날짜
            <input type="date" id="traceDate" required disabled />
          </label>

          <label for="content">
            변경 요약
            <textarea id="content" placeholder="수정한 내용을 간단히 입력하세요" maxlength="1000" required disabled></textarea>
          </label>

          <div class="btn-group">
            <button id="saveBtn" type="submit" disabled>등록</button>
            <button id="cancelBtn" type="button" hidden>수정 취소</button>
          </div>
          <p id="traceMessage" role="status" aria-live="polite">관리자 권한을 확인하고 있습니다.</p>
        </form>
      </section>

      <section class="admin-card board-table-card">
        <div class="admin-topbar">
          <div>
            <span class="section-label">기록 목록</span>
            <h3>등록된 변경 기록</h3>
          </div>
          <button id="refreshBtn" class="admin-btn" type="button" disabled>새로고침</button>
        </div>

        <div class="table-scroll">
          <table class="admin-table">
            <thead>
              <tr>
                <th>날짜</th>
                <th>변경 요약</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="traceTableBody"></tbody>
          </table>
        </div>

        <p class="admin-empty">이 목록은 DB에 저장된 기록입니다. 소스에 작성한 변경 요약은 사용자 화면에서 함께 표시됩니다.</p>
        <p id="emptyMessage" class="admin-empty" hidden>등록된 기록이 없습니다.</p>
      </section>
    </main>

    <script src="/github.io/assets/js/admin/common.js"></script>
    <script src="/github.io/assets/js/admin/header.js"></script>
    <script src="/github.io/assets/js/admin/changed-traces.js"></script>
  </body>
</html>
