<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>관리자 로그인</title>
    <link rel="stylesheet" href="../assets/css/admin/style.css" />
  </head>
  <body class="admin-login-page">
    <main class="admin-login-shell">
      <section class="admin-login-visual" aria-label="관리자 안내">
        <div class="login-brand">
          <span class="brand-mark">A</span>
          <span>Admin Console</span>
        </div>

        <div class="login-visual-copy">
          <p class="login-eyebrow">Secure Management</p>
          <h1>콘텐츠와 게시판을 한 곳에서 관리하세요.</h1>
          <p>관리자 인증 후 대시보드로 이동합니다.</p>
        </div>
      </section>

      <section class="admin-login-panel" aria-label="관리자 로그인">
        <div class="login-card">
          <div class="login-card-header">
            <p class="login-eyebrow">Welcome Back</p>
            <h2>관리자 로그인</h2>
          </div>

          <form id="login-form" class="login-form">
            <label for="username">
              아이디
              <input type="text" id="username" name="username" placeholder="관리자 아이디" autocomplete="username" required />
            </label>

            <label for="password">
              비밀번호
              <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호"
                autocomplete="current-password"
                required
              />
            </label>

            <button type="submit">로그인</button>
          </form>

          <p id="login-message" role="alert" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="../assets/js/admin/admin.js"></script>
  </body>
</html>
