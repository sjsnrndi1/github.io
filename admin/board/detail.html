<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/github.io/favicon.svg" />
    <title>게시글 상세</title>
    <link rel="stylesheet" href="/github.io/assets/css/admin/style.css" />
    <link rel="stylesheet" href="/github.io/assets/css/admin/board/style.css" />
  </head>
  <body class="admin-app-page">
    <div id="header-container"></div>

    <main class="admin-main board-main">
      <article class="admin-card post-detail-card">
        <div class="post-detail-head">
          <p class="dashboard-eyebrow">Post Detail</p>
          <h1 id="post-title"></h1>
          <p id="post-date"></p>
        </div>

        <div class="section post-content-section">
          <div id="post-content"></div>
        </div>

        <div class="section attachment-section" id="attachment-wrapper">
          <h3>첨부파일</h3>
          <div id="post-attachment"></div>
        </div>

        <div class="button-group">
          <button id="list-btn">목록</button>
          <button id="edit-btn">수정</button>
          <button id="delete-btn">삭제</button>
        </div>
      </article>
    </main>

    <script src="/github.io/assets/js/admin/common.js"></script>
    <script src="/github.io/assets/js/admin/header.js"></script>
    <script src="/github.io/assets/js/admin/board/board-detail.js"></script>
  </body>
</html>
