<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/github.io/favicon.svg" />
    <title>글 작성</title>
    <link rel="stylesheet" href="/github.io/assets/css/admin/style.css" />
    <link rel="stylesheet" href="/github.io/assets/css/admin/board/style.css" />
  </head>
  <body class="admin-app-page">
    <div id="header-container"></div>

    <main class="admin-main board-main">
      <section class="board-page-head">
        <div>
          <p class="dashboard-eyebrow">Create Post</p>
          <h2>새 게시글 작성</h2>
          <p>제목과 내용을 입력하고 필요한 경우 첨부파일을 함께 등록하세요.</p>
        </div>
      </section>

      <section class="admin-card board-form-card">
        <div class="admin-form">
          <label for="boardDcd">
            분류
            <select id="boardDcd">
              <option value="notice">공지사항</option>
              <option value="learned">배운 것들</option>
              <option value="blocked">막혔던 부분</option>
              <option value="review">다시 보기</option>
            </select>
          </label>

          <label for="title">
            제목
            <input type="text" id="title" placeholder="제목을 입력하세요" />
          </label>

          <label for="content">
            내용
            <textarea id="content" placeholder="내용을 입력하세요"></textarea>
          </label>

          <label for="summary">
            요약
            <textarea id="summary" placeholder="목록에 표시할 요약을 입력하세요"></textarea>
          </label>

          <label for="file">
            첨부파일
            <input type="file" id="file" />
            <small>첨부파일은 10MB 이하만 등록할 수 있습니다.</small>
          </label>

          <button id="saveBtn" class="admin-btn">저장</button>
        </div>
      </section>
    </main>

    <script src="/github.io/assets/js/admin/common.js"></script>
    <script src="/github.io/assets/js/admin/header.js"></script>
    <script src="/github.io/assets/js/admin/board/supabase.js?v=20261028-2"></script>
    <script src="/github.io/assets/js/admin/board/board-insert.js"></script>
  </body>
</html>
